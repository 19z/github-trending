name: Keep Alive by Issue Comment

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on keepalive issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = 1; // 换成你的 issue 编号
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `Keepalive: ${new Date().toISOString()}`
            });
